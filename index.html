<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <title>sfx-atelier</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#10131b;color:#edf1f7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 10%,#26314a 0,transparent 42%),#10131b}
    main{width:min(680px,100%);padding:clamp(24px,6vw,52px);border:1px solid #30394a;border-radius:24px;background:#191e29}
    .mark{display:inline-grid;place-items:center;width:42px;height:36px;border-radius:10px;background:#a8e6cf;color:#12231e;font-weight:800}
    p{color:#9ca8ba;line-height:1.8}
    a{display:inline-flex;margin:18px 8px 0 0;padding:13px 18px;border-radius:10px;background:#a8e6cf;color:#13251f;text-decoration:none;font-weight:750}
    a:focus-visible{outline:3px solid #91b8ff;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="mark">sfx</span>
    <h1>sfx-atelier</h1>
    <p>Web Audioを使った効果音・ジングル制作ツールの実験プロジェクトです。</p>
    <a href="./analysis-demo/">Audio Analysis Lab を開く</a>
    <a href="./ab/">A/B：mahjong 16 音</a>
  </main>
</body>
</html>
